# Daily: snapshot + watchlist + scoreboard. Dormant until this repo is pushed
# to GitHub. Outputs are committed back so Cloudflare Pages redeploys the site.
name: daily
on:
  schedule:
    - cron: "30 2 * * *"      # after FPL's overnight price window
  workflow_dispatch:
jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run daily jobs
        env:
          PYTHONPATH: .
        run: |
          python -m data.snapshot
          python -m models.price --train || true
          python -m models.price
          python -m predict.scoreboard
      - name: Commit outputs
        run: |
          git config user.name "fpl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots web/data models/artifacts/price_model.joblib || true
          git diff --cached --quiet || git commit -m "daily: snapshot + watchlist $(date -u +%F)"
          git push
