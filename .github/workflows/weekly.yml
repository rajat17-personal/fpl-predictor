# Weekly pre-deadline export: predictions + site JSON + digest. Dormant until
# this repo is pushed to GitHub. The trained model is supplied at run time,
# never committed to the repo (the model output directory is gitignored, so
# no checkout has ever contained it) — this is one of the reasons this
# workflow stays dispatch-only.
name: weekly
on:
  # Dispatch-only: the local WSL cron remains the one production scheduler
  # for the time-critical daily price snapshot this pipeline depends on —
  # that history cannot be backfilled if a day is missed. Arming this
  # workflow's own schedule is next milestone's work, once model delivery
  # and hosting are settled (D-12).
  workflow_dispatch:
jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Export predictions + digest
        env:
          PYTHONPATH: .
          PYTHON: python
        run: bash scripts/weekly.sh
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data data/raw/live
          if ! git diff --cached --quiet; then
            git commit -m "weekly: GW export $(date -u +%F)"
          fi
          git push
